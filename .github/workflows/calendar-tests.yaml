name: JavaScript behavior tests

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test calendar and cursor behavior
        run: node --test tests/*.test.cjs
