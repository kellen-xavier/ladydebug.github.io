# Hugo configuration file
baseURL: "https://ladydebug.com.br/"
title: "Lady{de}bug"
languageCode: pt-BR
defaultContentLanguage: pt
defaultContentLanguageInSubdir: false
enableEmoji: true

languages:
  pt:
    languageName: Português
    languageCode: pt-BR
    weight: 1
  en:
    languageName: English
    languageCode: en-US
    weight: 2
    params:
      description: "Study notes on software quality, Linux, and automation best practices."
    menu:
      main:
        - name: About
          pageRef: /about
          weight: 1
        - name: Contact ↗
          url: "https://ladydebug.keepo.bio/"
          weight: 2
        - name: GitHub
          url: "https://github.com/kellen-xavier"
          weight: 3
          params:
            icon: github
        - name: Search
          weight: 4
          params:
            type: search
        - name: RSS
          url: "/en/index.xml"
          weight: 5
          params:
            icon: rss
        - name: Language
          weight: 6
          params:
            type: language-switch
        - name: Theme
          weight: 7
          params:
            type: theme-toggle

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS]

menu:
  main:
    - name: Sobre
      pageRef: /about
      weight: 1
    - name: Contato ↗
      url: "https://ladydebug.keepo.bio/"
      weight: 2
    - name: GitHub
      weight: 3
      url: "https://github.com/kellen-xavier"
      params:
        icon: github
    - name: Buscar
      weight: 4
      params:
        type: search
    - name: RSS
      weight: 5
      url: "/index.xml"
      params:
        icon: rss
    - name: Idioma
      weight: 6
      params:
        type: language-switch
    - name: Tema
      weight: 7
      params:
        type: theme-toggle

params:
  description: "Notas de estudo sobre qualidade de software, Linux e boas práticas de automação."

  theme:
    default: light
    # O toggle de tema já vive no menu (item "Tema", type: theme-toggle).
    # Isso desliga só as instâncias extras que o Hextra mostra sozinho
    # (rodapé / fundo da sidebar) quando a sidebar esquerda está oculta.
    displayToggle: false

  navbar:
    displayTitle: true
    displayLogo: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
