# Hugo configuration file
title: "Lady{de}bug"
languageCode: pt-BR
defaultContentLanguage: pt
enableEmoji: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS]

menu:
  main:
    - name: Sobre
      pageRef: /about
      weight: 1
    - name: Contato ↗
      url: "https://ladydebug.keepo.bio/"
      weight: 2
    - name: GitHub
      weight: 3
      url: "https://github.com/kellen-xavier"
      params:
        icon: github
    - name: Buscar
      weight: 4
      params:
        type: search
    - name: RSS
      weight: 5
      url: "/index.xml"
      params:
        icon: rss
    - name: Tema
      weight: 6
      params:
        type: theme-toggle

params:
  description: "Notas de estudo sobre qualidade de software, Linux e boas práticas de automação."

  theme:
    default: light
    # O toggle de tema já vive no menu (item "Tema", type: theme-toggle).
    # Isso desliga só as instâncias extras que o Hextra mostra sozinho
    # (rodapé / fundo da sidebar) quando a sidebar esquerda está oculta.
    displayToggle: false

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
