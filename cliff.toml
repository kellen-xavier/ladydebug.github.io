[changelog]
header = """
# Changelog\n
Todas as mudanças notáveis deste projeto serão documentadas neste arquivo.

O formato é baseado em [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
e este projeto adere ao [Versionamento Semântico](https://semver.org/lang/pt-BR/).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Não lançado]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/kellen-xavier/ladydebug.github.io/commit/{{ commit.id }}))
{%- endfor %}
{% endfor -%}
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/kellen-xavier/ladydebug.github.io/compare/{{ release.previous.version }}...{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous and release.previous.version -%}
[Não lançado]: https://github.com/kellen-xavier/ladydebug.github.io/compare/{{ release.previous.version }}...HEAD
        {% endif -%}
    {% endif -%}
{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "" },
]
commit_parsers = [
  { message = "^[Mm]erge pull request", skip = true },
  { message = "^[Mm]erge branch", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Changed" },
  { message = "^docs", group = "Changed" },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { body = ".*[Ss]ecurity", group = "Security" },
  { message = ".*", group = "Changed" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
no_increment_regex = "chore|ci|docs|style|test|build"
